services:
  postgres:
    image: postgres:18.4-bookworm
    container_name: videoapp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-videoapp_dev}
      POSTGRES_USER: ${DB_USERNAME:-videoapp}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-videoapp_dev_pass}
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-videoapp} -d ${DB_NAME:-videoapp_dev}"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: videoapp-redis
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
